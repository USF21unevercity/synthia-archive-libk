services:
  - type: worker
    name: sci-telegram-bot
    env: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    plan: starter
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ARCHIVE_CHANNEL_ID
        sync: false
      - key: LOG_LEVEL
        value: info
